<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukiyo palette</title>
<link rel="icon" href="/*FAVICON*/">
<meta property="og:image" content="https://raw.githubusercontent.com/ukiyo-theme/palette/main/brand/banner.png">
<meta name="description" content="Every color in the Ukiyo theme, for the umi, yoru and kami variants.">
<!-- Generated by ukiyo-theme/palette (scripts/build.py) from palette.json. Do not edit by hand. -->
<style>
  :root { --bg: #1A1A22; --fg: #DCD7BA; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: background .2s, color .2s;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  .brand { display: flex; gap: 16px; align-items: center; }
  .brand svg { width: 64px; height: 64px; flex: none; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 28px; }
  h2 { font-size: 14px; font-weight: 600; margin: 32px 0 12px; color: var(--dim); }
  a { color: var(--link); }
  .sub { color: var(--dim); margin: 4px 0 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button {
    font: inherit; cursor: pointer; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  .tabs button[aria-pressed="true"] { background: var(--visual); border-color: var(--keyword); }
  pre {
    margin: 24px 0 0; padding: 16px 0; border-radius: 10px; overflow-x: auto;
    background: var(--code); border: 1px solid var(--border); font-size: 14px;
  }
  pre .ln { display: inline-block; width: 44px; padding-right: 16px; text-align: right; color: var(--nontext); user-select: none; }
  pre .line { display: block; padding-right: 16px; }
  pre .cur { background: var(--cursor); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sw {
    font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: transparent;
  }
  .sw .chip { height: 56px; }
  .sw .meta { padding: 8px 10px; font-size: 13px; }
  .sw .hex { color: var(--dim); }
  .sw .ratio { float: right; color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 32px; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px;
    border-radius: 8px; background: var(--fg); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <!--MARK-->
      <div>
        <h1>Ukiyo</h1>
        <p class="sub" id="desc"></p>
      </div>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="Variant"></div>
  </header>
  <pre id="code"></pre>
  <div id="groups"></div>
  <p class="note">Click a swatch to copy its hex. The number on each swatch is its WCAG contrast against <code>bg</code>.
    Colors come from <a href="https://github.com/ukiyo-theme/palette/blob/main/palette.json">palette.json</a>.
    Ports: <a href="https://github.com/ukiyo-theme/nvim">Neovim</a>, <a href="https://github.com/ukiyo-theme/vscode">VS Code</a>,
    <a href="https://github.com/ukiyo-theme/zed">Zed</a>, <a href="https://github.com/ukiyo-theme/t3code">T3 Code</a>,
    <a href="https://github.com/ukiyo-theme/extras">terminals and CLI tools</a>.</p>
</main>
<div id="toast" role="status"></div>
<script>
const PALETTE = /*PALETTE*/null;
const GROUPS = /*GROUPS*/null;
const CODE = /*CODE*/null;
const ROLES = /*ROLES*/null;

function lum(hex) {
  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function contrast(a, b) {
  const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
function el(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids);
  return node;
}

let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1200);
}

function render(name) {
  const v = PALETTE[name], c = v.colors, root = document.documentElement.style;
  const vars = { bg: c.bg, fg: c.fg, dim: c.fg_dim, border: c.border, visual: c.visual, keyword: c.keyword,
    link: c.func, code: c.bg_m1, cursor: c.bg_p2, nontext: c.nontext };
  for (const [k, val] of Object.entries(vars)) root.setProperty("--" + k, val);
  document.documentElement.style.colorScheme = v.appearance;
  document.getElementById("desc").textContent = `${name} · ${v.appearance} · ${v.description}`;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-pressed", b.dataset.name === name);

  const pre = document.getElementById("code");
  pre.replaceChildren(...CODE.map((runs, i) => el("span", { className: "line" + (i === 3 ? " cur" : "") },
    el("span", { className: "ln", textContent: i + 1 }),
    ...runs.map(([role, text]) => el("span", { textContent: text, style: `color:${c[role]}`, title: role })),
    "\n")));

  const groups = document.getElementById("groups");
  groups.replaceChildren(...GROUPS.flatMap(([group, roles]) => [
    el("h2", { textContent: group }),
    el("div", { className: "grid" }, ...roles.map(role => {
      const btn = el("button", { className: "sw", title: ROLES[role] || role },
        el("div", { className: "chip", style: `background:${c[role]}` }),
        el("div", { className: "meta" },
          el("span", { className: "ratio", textContent: contrast(c[role], c.bg).toFixed(1) }),
          el("div", { textContent: role }),
          el("div", { className: "hex", textContent: c[role].toUpperCase() })));
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(c[role].toUpperCase()); toast(`Copied ${role} ${c[role].toUpperCase()}`); }
        catch { toast(c[role].toUpperCase()); }
      });
      return btn;
    })),
  ]));
  try { history.replaceState(null, "", "#" + name); } catch {}
}

const tabs = document.getElementById("tabs");
for (const name of Object.keys(PALETTE)) {
  const b = el("button", { textContent: name });
  b.dataset.name = name;
  b.addEventListener("click", () => render(name));
  tabs.append(b);
}
const fromHash = location.hash.slice(1);
render(PALETTE[fromHash] ? fromHash : Object.keys(PALETTE)[0]);
</script>
</body>
</html>
