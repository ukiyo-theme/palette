<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukiyo palette</title>
<meta name="description" content="Every color in the Ukiyo theme, for the umi, yoru and kami variants.">
<!-- Generated by ukiyo-theme/palette (scripts/build.py) from palette.json. Do not edit by hand. -->
<style>
  :root { --bg: #1A1A22; --fg: #DCD7BA; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: background .2s, color .2s;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 28px; }
  h2 { font-size: 14px; font-weight: 600; margin: 32px 0 12px; color: var(--dim); }
  a { color: var(--link); }
  .sub { color: var(--dim); margin: 4px 0 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button {
    font: inherit; cursor: pointer; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  .tabs button[aria-pressed="true"] { background: var(--visual); border-color: var(--keyword); }
  pre {
    margin: 24px 0 0; padding: 16px 0; border-radius: 10px; overflow-x: auto;
    background: var(--code); border: 1px solid var(--border); font-size: 14px;
  }
  pre .ln { display: inline-block; width: 44px; padding-right: 16px; text-align: right; color: var(--nontext); user-select: none; }
  pre .line { display: block; padding-right: 16px; }
  pre .cur { background: var(--cursor); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sw {
    font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: transparent;
  }
  .sw .chip { height: 56px; }
  .sw .meta { padding: 8px 10px; font-size: 13px; }
  .sw .hex { color: var(--dim); }
  .sw .ratio { float: right; color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 32px; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px;
    border-radius: 8px; background: var(--fg); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Ukiyo</h1>
      <p class="sub" id="desc"></p>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="Variant"></div>
  </header>
  <pre id="code"></pre>
  <div id="groups"></div>
  <p class="note">Click a swatch to copy its hex. The number on each swatch is its WCAG contrast against <code>bg</code>.
    Colors come from <a href="https://github.com/ukiyo-theme/palette/blob/main/palette.json">palette.json</a>.
    Ports: <a href="https://github.com/ukiyo-theme/nvim">Neovim</a>, <a href="https://github.com/ukiyo-theme/vscode">VS Code</a>,
    <a href="https://github.com/ukiyo-theme/zed">Zed</a>, <a href="https://github.com/ukiyo-theme/t3code">T3 Code</a>,
    <a href="https://github.com/ukiyo-theme/extras">terminals and CLI tools</a>.</p>
</main>
<div id="toast" role="status"></div>
<script>
const PALETTE = {"umi": {"appearance": "dark", "description": "Sea. The default dark variant: ink-blue background, warm text.", "colors": {"bg0": "#14141B", "bg_m2": "#16161D", "bg_m1": "#18181F", "bg": "#1A1A22", "bg_p1": "#1E1E27", "bg_p2": "#22222C", "bg3": "#2A2A37", "visual": "#2D3F5C", "search": "#3D5378", "border": "#54546D", "nontext": "#54546D", "ui_special": "#938FB0", "fg": "#E2DCC5", "fg_dim": "#C8C093", "comment": "#8A8980", "keyword": "#C4A8F5", "func": "#82A8E8", "string": "#A3C97A", "type": "#7FC4B4", "number": "#E08AA6", "constant": "#F2A36B", "field": "#E8C88A", "operator": "#D6B77A", "builtin": "#E8707E", "punct": "#9DAACC", "param": "#B8B4D0", "special": "#9ED6D8", "error": "#F2616E", "warn": "#F0A35E", "info": "#6FB5D6", "hint": "#7FC4B4", "diff_add": "#24352A", "diff_change": "#252F45", "diff_delete": "#3A2228", "diff_text": "#3A4A6A", "git_add": "#8FB573", "git_change": "#D6B77A", "git_delete": "#E8707E"}}, "yoru": {"appearance": "dark", "description": "Night. Darker and warmer, with less saturated colors.", "colors": {"bg0": "#0F0F0E", "bg_m2": "#121211", "bg_m1": "#141312", "bg": "#161514", "bg_p1": "#1A1918", "bg_p2": "#1E1D1B", "bg3": "#262523", "visual": "#2B3240", "search": "#3B4659", "border": "#4A4744", "nontext": "#4A4744", "ui_special": "#9A958A", "fg": "#D2CDBF", "fg_dim": "#B5B0A3", "comment": "#8C8578", "keyword": "#B8A3D6", "func": "#8BA4C7", "string": "#A3B58A", "type": "#8FB8AA", "number": "#D49BA9", "constant": "#D9A273", "field": "#D9BE8C", "operator": "#C4AE84", "builtin": "#D9787F", "punct": "#A3A9B8", "param": "#BDB3C6", "special": "#9EC3C2", "error": "#E0616A", "warn": "#E09B5E", "info": "#79A8C6", "hint": "#8FB8AA", "diff_add": "#1F2A1F", "diff_change": "#1F2533", "diff_delete": "#2F1C1E", "diff_text": "#32405A", "git_add": "#94AD7E", "git_change": "#C4AE84", "git_delete": "#D9787F"}}, "kami": {"appearance": "light", "description": "Paper. A light variant at about 60% brightness, between a dark and a light theme.", "colors": {"bg0": "#C8C2B0", "bg_m2": "#CBC5B4", "bg_m1": "#CEC8B8", "bg": "#D2CCBC", "bg_p1": "#CDC7B6", "bg_p2": "#CAC3B1", "bg3": "#C2BBA8", "visual": "#B2BAC8", "search": "#A2B0C6", "border": "#989280", "nontext": "#8D8777", "ui_special": "#5A5463", "fg": "#292830", "fg_dim": "#3F3E49", "comment": "#595750", "keyword": "#523B83", "func": "#2B497A", "string": "#36561D", "type": "#22564D", "number": "#7F3451", "constant": "#7B4116", "field": "#674B0F", "operator": "#604E22", "builtin": "#892D38", "punct": "#485064", "param": "#514967", "special": "#235367", "error": "#981F2E", "warn": "#82450B", "info": "#20547A", "hint": "#23594F", "diff_add": "#BFC9AD", "diff_change": "#BEC4CD", "diff_delete": "#D5BAB8", "diff_text": "#A7B4C6", "git_add": "#34611E", "git_change": "#705210", "git_delete": "#9D2F3B"}}};
const GROUPS = [["Syntax", ["keyword", "func", "string", "type", "number", "constant", "field", "operator", "builtin", "punct", "param", "special", "comment"]], ["Text and UI", ["fg", "fg_dim", "ui_special", "nontext", "border", "visual", "search"]], ["Backgrounds", ["bg0", "bg_m2", "bg_m1", "bg", "bg_p1", "bg_p2", "bg3"]], ["Diagnostics and git", ["error", "warn", "info", "hint", "git_add", "git_change", "git_delete", "diff_add", "diff_change", "diff_delete", "diff_text"]]];
const CODE = [[["comment", "-- Ukiyo: pictures of the floating world"]], [["keyword", "local"], ["fg", " "], ["type", "Wave"], ["fg", " "], ["operator", "="], ["fg", " "], ["punct", "{}"]], [], [["keyword", "function"], ["fg", " "], ["type", "Wave"], ["punct", "."], ["func", "new"], ["punct", "("], ["param", "height"], ["punct", ","], ["fg", " "], ["param", "color"], ["punct", ")"]], [["fg", "  "], ["keyword", "local"], ["fg", " self "], ["operator", "="], ["fg", " "], ["special", "setmetatable"], ["punct", "({"], ["fg", " "], ["field", "height"], ["fg", " "], ["operator", "="], ["fg", " "], ["param", "height"], ["punct", ","], ["fg", " "], ["field", "crest"], ["fg", " "], ["operator", "="], ["fg", " "], ["constant", "true"], ["fg", " "], ["punct", "},"], ["fg", " "], ["type", "Wave"], ["punct", ")"]], [["fg", "  self"], ["punct", "."], ["field", "color"], ["fg", " "], ["operator", "="], ["fg", " "], ["param", "color"], ["fg", " "], ["keyword", "or"], ["fg", " "], ["string", "\"indigo\""]], [["fg", "  "], ["keyword", "if"], ["fg", " "], ["param", "height"], ["fg", " "], ["operator", ">"], ["fg", " "], ["number", "36"], ["fg", " "], ["keyword", "then"], ["fg", " "], ["builtin", "error"], ["punct", "("], ["string", "\"too tall\""], ["punct", ")"], ["fg", " "], ["keyword", "end"]], [["fg", "  "], ["builtin", "return"], ["fg", " self"]], [["keyword", "end"]]];
const ROLES = {"bg0": "Darkest background in dark variants: floats, statusline, sidebars. In kami it is the deepest paper tone.", "bg_m2": "Background between bg0 and bg.", "bg_m1": "Background one step from bg, used for dimmed inactive windows.", "bg": "Main editor background.", "bg_p1": "One step from bg: color column, folds, selected tab.", "bg_p2": "Cursorline.", "bg3": "Popup and completion menu background.", "visual": "Visual selection and selected menu item.", "search": "Search match background.", "border": "Window borders and scrollbar thumbs.", "nontext": "Line numbers, whitespace and other non-text characters.", "ui_special": "Secondary UI text: sign column, tab labels, float titles.", "fg": "Main text and variables.", "fg_dim": "Secondary text: floats, status line, messages.", "comment": "Comments.", "keyword": "Keywords and statements.", "func": "Function and method names.", "string": "Strings.", "type": "Types, classes and interfaces.", "number": "Numbers.", "constant": "Constants and booleans.", "field": "Fields, properties and object keys.", "operator": "Operators and regular expressions.", "builtin": "Builtin variables such as self, this and vim, plus return and throw.", "punct": "Brackets and delimiters.", "param": "Function parameters.", "special": "Constructors, builtin functions, special punctuation such as interpolation braces, and URLs.", "error": "Error diagnostics.", "warn": "Warning diagnostics.", "info": "Info diagnostics.", "hint": "Hint diagnostics.", "diff_add": "Background of added lines.", "diff_change": "Background of changed lines.", "diff_delete": "Background of deleted lines.", "diff_text": "Background of the changed text inside a changed line.", "git_add": "Sign or marker for added lines.", "git_change": "Sign or marker for changed lines.", "git_delete": "Sign or marker for deleted lines."};

function lum(hex) {
  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function contrast(a, b) {
  const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
function el(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids);
  return node;
}

let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1200);
}

function render(name) {
  const v = PALETTE[name], c = v.colors, root = document.documentElement.style;
  const vars = { bg: c.bg, fg: c.fg, dim: c.fg_dim, border: c.border, visual: c.visual, keyword: c.keyword,
    link: c.func, code: c.bg_m1, cursor: c.bg_p2, nontext: c.nontext };
  for (const [k, val] of Object.entries(vars)) root.setProperty("--" + k, val);
  document.documentElement.style.colorScheme = v.appearance;
  document.getElementById("desc").textContent = `${name} · ${v.appearance} · ${v.description}`;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-pressed", b.dataset.name === name);

  const pre = document.getElementById("code");
  pre.replaceChildren(...CODE.map((runs, i) => el("span", { className: "line" + (i === 3 ? " cur" : "") },
    el("span", { className: "ln", textContent: i + 1 }),
    ...runs.map(([role, text]) => el("span", { textContent: text, style: `color:${c[role]}`, title: role })),
    "\n")));

  const groups = document.getElementById("groups");
  groups.replaceChildren(...GROUPS.flatMap(([group, roles]) => [
    el("h2", { textContent: group }),
    el("div", { className: "grid" }, ...roles.map(role => {
      const btn = el("button", { className: "sw", title: ROLES[role] || role },
        el("div", { className: "chip", style: `background:${c[role]}` }),
        el("div", { className: "meta" },
          el("span", { className: "ratio", textContent: contrast(c[role], c.bg).toFixed(1) }),
          el("div", { textContent: role }),
          el("div", { className: "hex", textContent: c[role].toUpperCase() })));
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(c[role].toUpperCase()); toast(`Copied ${role} ${c[role].toUpperCase()}`); }
        catch { toast(c[role].toUpperCase()); }
      });
      return btn;
    })),
  ]));
  try { history.replaceState(null, "", "#" + name); } catch {}
}

const tabs = document.getElementById("tabs");
for (const name of Object.keys(PALETTE)) {
  const b = el("button", { textContent: name });
  b.dataset.name = name;
  b.addEventListener("click", () => render(name));
  tabs.append(b);
}
const fromHash = location.hash.slice(1);
render(PALETTE[fromHash] ? fromHash : Object.keys(PALETTE)[0]);
</script>
</body>
</html>
